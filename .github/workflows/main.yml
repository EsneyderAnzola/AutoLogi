name: Sincronizacion Automatizada AutoLogi

on:
  schedule:
    # Se ejecuta cada 3 horas (00:00, 03:00, 06:00, 09:00, 12:00, 15:00, 18:00, 21:00 UTC)
    # En hora de Colombia (UTC-5) sería: 7PM, 10PM, 1AM, 4AM, 7AM, 10AM, 1PM, 4PM.
    - cron: '0 */3 * * *'
  workflow_dispatch: # Permite ejecución manual desde la pestaña Actions para pruebas

jobs:
  run-sync:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar codigo del repositorio
        uses: actions/checkout@v3

      - name: Configurar entorno de Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Instalar librerias necesarias
        run: |
          pip install pandas sqlalchemy psycopg2-binary gspread gspread-dataframe google-auth

      - name: Ejecutar script de sincronizacion
        env:
          DB_URL: ${{ secrets.DB_URL }}
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
        run: python sync_supabase.py
          DB_URL: ${{ secrets.DB_URL }}
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
        run: python sync_supabase.py

