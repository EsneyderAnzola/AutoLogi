name: Sincronizacion Automatizada AutoLogi

on:
  schedule:
    - cron: '0 */3 * * *'
  workflow_dispatch:

jobs:
  run-sync:
    runs-on: ubuntu-24.04

    steps:
      - name: Descargar codigo del repositorio
        uses: actions/checkout@v4

      - name: Instalar uv y Python
        uses: astral-sh/setup-uv@v5
        with:
          python-version: '3.12'
          enable-cache: true
          cache-suffix: autologi

      - name: Instalar librerias necesarias
        run: |
          uv pip install --system pandas sqlalchemy "psycopg[binary]" psycopg2-binary gspread gspread-dataframe google-auth

      - name: Ejecutar script de sincronizacion
        env:
          DB_URL: ${{ secrets.DB_URL }}
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
        run: python sync_supabase.py
